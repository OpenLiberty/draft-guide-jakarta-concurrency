<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Open Liberty System Load</title>
        <link rel="stylesheet" href="css/styles.css">
        <link href="favicon.ico" rel="icon" />
        <link href="favicon.ico" rel="shortcut icon" />
    </head>
    <body>
        <section id="appIntro">
            <div id="titleSection">
                <h1 id="appTitle">Open Liberty System Load</h1>
                <div class="line"></div>
                <div class="headerImage"></div>
            </div>

            <div class="msSection" id="systemLoads">
                <div class="headerRow">
                    <div class="headerIcon">
                      <img src="img/sysProps.svg"/>
                    </div>
                    <div class="headerTitle" id="sysPropTitle">
                      <h2>
                        <label>System Loads</label>
                        <img class="refreshButton" src="img/refresh.svg" title="Refresh system load after 5 seconds" onclick="restCall('refresh')"></img>
                        <img class="scheduleButton" src="img/schedule.svg" title="Schedule to refresh system load for every 10 seconds" onclick="restCall('schedule')"></img>
                      </h2>
                    </div>
                </div>
                <div class="sectionContent">
                    <table id="systemLoadsTable">
                        <tbody id="systemLoadsTableBody">
                            <tr>
                                <th style="width: 20%;">Time</th>
                                <th style="width: 20%;">CPU Load (%)</th>
                                <th>Memory Usage (%)</th>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
        <footer class="bodyFooter">
            <div class="bodyFooterLink">
                <a id="licenseLink"
                   href="https://github.com/OpenLiberty/open-liberty/blob/release/LICENSE"
                >License</a>
                <a href="https://github.com/OpenLiberty">GitHub</a>
                <a href="https://stackoverflow.com/questions/tagged/open-liberty">stackoverflow</a>
                <a href="https://groups.io/g/openliberty">groups.io</a>
                <a href="https://openliberty.io/">openliberty.io</a>
            </div>
            <p id="footer_text">an IBM open source project</p>
            <p id="footer_copyright">&copy;Copyright IBM Corp. 2025</p>
        </footer>
        <script src="index.js"></script>
    </body>
</html>
